<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ALX Game Tool</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #080509;
            color: #c9a84a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .section {
            background: #17121b;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #c9a84a;
            width: 100%;
            max-width: 520px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 6px 30px rgba(201,168,74,0.15);
        }
        h2 { margin-top: 0; text-transform: uppercase; letter-spacing: 2px; color: #fff; }
        p { color: #b8a7c3; font-size: 0.9rem; margin-bottom: 20px; }
        
        input {
            width: 80%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #c9a84a;
            background: #0f0812;
            color: white;
            font-size: 1.2rem;
            text-align: center;
            text-transform: uppercase;
        }
        .fusion-inputs {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .fusion-inputs input { width: 80px; }
        
        .result-label { color: #b8a7c3; font-size: 0.8rem; text-transform: uppercase; margin-top: 10px; }
        .result-display {
            font-weight: bold;
            font-size: 1.8rem;
            min-height: 2.2rem;
            margin-top: 5px;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        .success { color: #4682B4; }
        .half { color: #FFD700; }
        .failure { color: #FF6347; }
        .fusion-out { color: #9ff88b; }
        .muted { font-size: 0.75rem; color: #7a6b82; margin-top: 12px; }
    </style>
</head>
<body>

    <div class="section">
        <h2>Encounter Resolver</h2>
        <p>Type encounter key + verb code (e.g. <code>A1A</code>, <code>AH14B</code>, <code>CJ41B</code>, <code>DZ116A</code>)</p>
        <input type="text" id="encInput" placeholder="e.g. AH14B or A4A" maxlength="14" autofocus>
        <div class="result-label">Status</div>
        <div id="encStatus" class="result-display">---</div>
    </div>

    <div class="section">
        <h2>Fusions</h2>
        <p>Combine two element numbers</p>
        <div class="fusion-inputs">
            <input type="number" id="f1" placeholder="0">
            <span style="font-size: 1.5rem">+</span>
            <input type="number" id="f2" placeholder="0">
        </div>
        <div class="result-label">Resulting Element</div>
        <div id="fResult" class="result-display">---</div>
        <p class="muted">Fusions & encounters: run <code>npm run sync-helper</code> in this repo after changing <code>alx.html</code>.</p>
    </div>

    // --- LOGIC ---
    const fusionMap = new Map();
    fuseList.forEach(item => {
        const [equation, result] = item.split(' = ');
        const [a, b] = equation.split(' + ');
        fusionMap.set(`${a.trim()}+${b.trim()}`, result.trim());
        fusionMap.set(`${b.trim()}+${a.trim()}`, result.trim());
    });

    function resolveEncounter(rawUpper) {
        const raw = rawUpper.trim();
        if (raw.length < 3) return null;

        if (raw.length >= 2) {
            const two = raw.slice(0, 2);
            if (encounterEffects[two]) {
                const verbKey = raw.slice(2);
                if (/^\d/.test(verbKey)) return { row: encounterEffects[two], verbKey };
            }
        }
        const one = raw.slice(0, 1);
        if (encounterEffects[one]) {
            const verbKey = raw.slice(1);
            if (/^\d/.test(verbKey)) return { row: encounterEffects[one], verbKey };
        }
        return null;
    }

    const encInput = document.getElementById('encInput');
    const encStatus = document.getElementById('encStatus');
    const f1 = document.getElementById('f1');
    const f2 = document.getElementById('f2');
    const fResult = document.getElementById('fResult');

    encInput.addEventListener('input', () => {
        const raw = encInput.value.toUpperCase().trim().replace(/\s+/g, '');
        if (raw.length < 3) {
            encStatus.innerText = "---";
            encStatus.className = "result-display";
            return;
        }

        const hit = resolveEncounter(raw);
        if (!hit) {
            encStatus.innerText = "Unknown encounter";
            encStatus.className = "result-display failure";
            return;
        }

        const { row, verbKey } = hit;
        if (row.effects.includes(verbKey)) {
            encStatus.innerText = "Success";
            encStatus.className = "result-display success";
        } else if (row.effects.includes("-" + verbKey)) {
            encStatus.innerText = "Half Success";
            encStatus.className = "result-display half";
        } else {
            encStatus.innerText = "Failure";
            encStatus.className = "result-display failure";
        }
    });

    function calcFusion() {
        const a = String(f1.value).trim();
        const b = String(f2.value).trim();
        if (a === "" || b === "") {
            fResult.innerText = "---";
            fResult.className = "result-display";
            return;
        }

        const key = `${a}+${b}`;
        if (fusionMap.has(key)) {
            fResult.innerText = fusionMap.get(key);
            fResult.className = "result-display fusion-out";
        } else {
            fResult.innerText = "No fusion";
            fResult.className = "result-display failure";
        }
    }

    f1.addEventListener('input', calcFusion);
    f2.addEventListener('input', calcFusion);
